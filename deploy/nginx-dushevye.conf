server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/dushevye/public;
    index index.html;

    # Security headers (P1 #5). script-src keeps 'unsafe-inline' temporarily:
    # LK pages still have inline <script> blocks (login, catalog, cabinets).
    # Debt: move those into auth.js / page modules, then drop 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No Meta pixels / trackers on public site — keep plain static.
    #
    # Regex locations are checked before ordinary prefixes. First match wins.
    # Do not add ^~ to a /media/ prefix and do not alias /media/: ^~ skips these
    # denies, and the old alias location was exactly that bypass for .bak/.db/.env
    # sitting under the photo tree. Media is served from `root` (public/media/...).
    # A dot path is any "/." . Dangerous extensions match when the suffix is
    # ".", "/", or the end of the URI (index.html.bak.20260101, file.sql/, file.db).
    location ~* /\. {
        deny all;
    }

    location ~* \.(?:sqlite|bak|sql|db|env)(?:\.|/|$) {
        deny all;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache headers for real product photos. Listed after the denies, and only
    # for image suffixes, so /media/secret.bak is still denied above.
    # add_header here replaces the server headers, so the security set is repeated.
    location ~* ^/media/.+\.(?:jpe?g|png|gif|webp|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
