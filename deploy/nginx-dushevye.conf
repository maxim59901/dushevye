server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/dushevye/public;
    index index.html;

    # Security headers (P1 #5). script-src keeps 'unsafe-inline' temporarily:
    # LK pages still have inline <script> blocks (login, catalog, cabinets).
    # Debt: move those into auth.js / page modules, then drop 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # No Meta pixels / trackers on public site — keep plain static.
    location /api/ {
        proxy_pass http://127.0.0.1:8088/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Local product photo cache (also available under /public/media via root)
    location /media/ {
        alias /var/www/dushevye/public/media/;
        expires 7d;
        add_header Cache-Control "public";
        # re-add CSP on aliased location (nginx add_header inheritance quirk)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: http:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
